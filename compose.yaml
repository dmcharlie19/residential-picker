name: residential-picker
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/storage/residential-picker.sqlite3
      PRICE_MAX_AGE_DAYS: "30"
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data:/app/storage
      - ./data:/data:ro
  frontend:
    build: ./frontend
    environment: {API_UPSTREAM: "backend:8000"}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
